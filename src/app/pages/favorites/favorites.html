<div class="container page">
  <h1 class="titre-section">Mes favoris</h1>

  @if (favoris().length) {
    <div class="grille-films">
      @for (film of favoris(); track film.id) {
        <app-movie-card [movie]="film" />
      }
    </div>
  } @else {
    <div class="etat-vide">
      <span class="material-symbols-outlined">favorite</span>
      <p>Vous n'avez pas encore de film favori.</p>
      <a routerLink="/" class="bouton-or">Découvrir les films</a>
    </div>
  }
</div>
