<button
  type="button"
  class="favori"
  [class.favori--coeur]="variante() === 'coeur'"
  [class.favori--texte]="variante() === 'texte'"
  [class.bouton-contour]="variante() === 'texte'"
  [class.actif]="actif()"
  [attr.aria-pressed]="actif()"
  [attr.aria-label]="libelle()"
  [title]="erreur() ? 'Impossible de modifier vos favoris, réessayez.' : libelle()"
  (click)="basculer($event)"
>
  <svg class="coeur" viewBox="0 0 24 24" aria-hidden="true">
    <path
    d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
    />
  </svg>
  @if (variante() === 'texte') {
    {{ actif() ? 'Dans mes favoris' : 'Favori' }}
  }
</button>
@if (erreur() && variante() === 'texte') {
  <span class="favori-erreur" role="alert">Impossible de modifier vos favoris, réessayez.</span>
}
